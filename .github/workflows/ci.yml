name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: brew install librime shellcheck

      - name: Configure librime paths
        run: |
          echo "RIME_INCLUDE_DIR=$(brew --prefix librime)/include" >> "$GITHUB_ENV"
          echo "RIME_LIB_DIR=$(brew --prefix librime)/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Download Rime data
        run: bash scripts/download-rime-data.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Run conversion smoke tests
        run: bash scripts/test-conversion.sh
