name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify tag and runner architecture
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag_version"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install system dependencies
        run: brew install jq librime shellcheck

      - name: Configure librime paths
        run: |
          echo "RIME_INCLUDE_DIR=$(brew --prefix librime)/include" >> "$GITHUB_ENV"
          echo "RIME_LIB_DIR=$(brew --prefix librime)/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Download Rime data
        run: bash scripts/download-rime-data.sh

      - name: Run release gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          bash scripts/test-conversion.sh

      - name: Build portable package
        run: bash scripts/package-portable-macos.sh

      - name: Verify portable package
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/check-release-package.sh \
            "dist/pinyin-v${version}-macos-${{ matrix.arch }}.zip" \
            "$version" \
            "${{ matrix.arch }}"

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: pinyin-${{ matrix.arch }}
          path: dist/pinyin-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download portable packages
        uses: actions/download-artifact@v8
        with:
          pattern: pinyin-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        working-directory: release-assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "pinyin-v${version}-macos-arm64.zip"
          test -f "pinyin-v${version}-macos-x86_64.zip"
          sha256sum \
            "pinyin-v${version}-macos-arm64.zip" \
            "pinyin-v${version}-macos-x86_64.zip" \
            > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "release-assets/pinyin-v${version}-macos-arm64.zip"
            "release-assets/pinyin-v${version}-macos-x86_64.zip"
            "release-assets/SHA256SUMS"
          )

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "pinyin $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "pinyin $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
