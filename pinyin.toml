# Strings used to enter and exit a pinyin session.
#
# These values must not contain punctuation that the converter treats as body
# separators: comma, period, question mark, exclamation mark, minus, plus,
# ellipsis, tilde, or double quote, including their Chinese/full-width variants.
trigger_prefix = "''"
trigger_suffix = "''"

# Conversion modes:
# - "segmented": stable default. Split body into pinyin runs and separators,
#   convert each pinyin run independently, and map punctuation ourselves.
# - "rime-auto": experimental. Feed the whole body to one Rime session and let
#   Rime decide commits/candidates, including any mixed Chinese/English behavior
#   provided by the active schema.
conversion_mode = "segmented"

# Candidate UI shown while the listener is in an active session.
# Layout values: "horizontal" or "vertical".
candidate_layout = "horizontal"
candidate_count = 5

# Candidate interaction keys. Number keys map to available candidate slots in
# order. Selection and page keys are only captured while pending ASCII pinyin
# has a candidate menu. The English key commits pending ASCII letters unchanged;
# outside those states these characters are inserted normally.
candidate_select_keys = "1234567890"
candidate_page_next_key = "="
candidate_page_previous_key = "-"
english_commit_key = "`"
